# 🎀 Multi-Container X-Post Agent ✨

services:
  # 🖥️ GUI Display Stack
  display:
    build: .
    container_name: x-display
    ports:
      - "29190:8080" # noVNC
    environment:
      - VNC_PASSWORD=password
      - SCREEN_WIDTH=1280
      - SCREEN_HEIGHT=720
      - SCREEN_DEPTH=24
    volumes:
      - x11-socket:/tmp/.X11-unix # X11ソケットを共有 🤝
    entrypoint: [ "./entrypoint.sh" ]
    restart: unless-stopped

  # 🌐 Normal Browser Helper (for manual login)
  browser-helper:
    build: .
    container_name: browser-helper
    entrypoint: [] # entrypoint.shを動かさないようにするよ✨
    profiles:
      - helper # docker compose --profile helper up で起動してね✨
    depends_on:
      - display
    environment:
      - DISPLAY=x-display:99
    volumes:
      - x11-socket:/tmp/.X11-unix
      - ./user_data:/app/user_data
    shm_size: '2gb'
    command: [ "/bin/bash", "-c", "until timeout 1 bash -c 'cat < /dev/null > /dev/tcp/x-display/6099' 2>/dev/null; do echo 'Waiting for X server on x-display:6099...'; sleep 1; done; rm -f /app/user_data/Singleton* && /usr/bin/google-chrome-stable --user-data-dir=/app/user_data --no-sandbox --disable-gpu --disable-software-rasterizer" ]
    restart: "no"

  # 🎭 Playwright Agent
  agent:
    build: .
    container_name: x-agent
    depends_on:
      - display
    environment:
      - DISPLAY=x-display:99
    volumes:
      - x11-socket:/tmp/.X11-unix # ディスプレイをジャック！🚀
      - ./src:/app/src
      - ./uploads:/app/uploads
      - ./logs:/app/logs
      - ./user_data:/app/user_data # ログイン情報をここに残すよ💖
    shm_size: '2gb'
    entrypoint: [] # entrypoint.shを動かさないようにするよ✨
    command: [ "/bin/bash", "-c", "rm -f /app/user_data/Singleton* && npm start" ]
    restart: on-failure

volumes:
  x11-socket:
